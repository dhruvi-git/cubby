# Runs Cubby's database AND backend in Docker.
# Docker runs Linux, so Windows Smart App Control can't block the backend.
#   Start:          docker compose up -d --build
#   See logs:       docker compose logs -f backend
#   After .env edit: docker compose up -d --force-recreate backend
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cubby
      POSTGRES_PASSWORD: cubby
      POSTGRES_DB: cubby
    ports:
      - "5433:5432"
    volumes:
      - cubby-db:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://cubby:cubby@db:5432/cubby
      LOCAL_STORAGE_DIR: /app/data/files
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ${APPDATA}/gcloud:/gcloud:ro
    depends_on:
      - db

volumes:
  cubby-db:
